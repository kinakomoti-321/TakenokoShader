name: Release packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release-packages.yml'
      - 'TakenokoShader/Tools~/build_packages.py'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string

permissions:
  contents: write

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  cleanup-obsolete-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete VPM and development assets from existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$RELEASE_REPOSITORY/releases" \
            --jq '.[].assets[] | select(.name == "index.json" or ((.name | startswith("com.kinankomoti.takenokoshader-") or startswith("com.kinankomoti.takenokoshaderarealight-")) and (.name | endswith(".zip"))) or ((.name | startswith("com.kinankomoti.shaderbindingexporter-")) and (.name | endswith(".tgz")))) | .id' |
          while IFS= read -r asset_id; do
            gh api --method DELETE "repos/$RELEASE_REPOSITORY/releases/assets/$asset_id"
          done
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: cleanup-obsolete-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Check out packaging tools from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: TakenokoShader/Tools~
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify package builder
        run: python -m unittest discover -s .release-tools/TakenokoShader/Tools~ -p 'test_*.py'
      - name: Build unitypackages
        run: >-
          python .release-tools/TakenokoShader/Tools~/build_packages.py
          --project TakenokoShader
          --output TakenokoShader/Build/Packages
      - name: Publish unitypackages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          unitypackages=(
            TakenokoShader/Build/Packages/com.kinankomoti.takenokoshader-*.unitypackage
            TakenokoShader/Build/Packages/com.kinankomoti.takenokoshaderarealight-*.unitypackage
          )
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --json assets > "$RUNNER_TEMP/release-assets.json"; then
            # Keep published assets intact; only add missing unitypackages.
            for file in "${unitypackages[@]}"; do
              if ! jq -e --arg name "$(basename "$file")" '.assets | any(.name == $name)' "$RUNNER_TEMP/release-assets.json" > /dev/null; then
                gh release upload "$RELEASE_TAG" "$file" --repo "$RELEASE_REPOSITORY"
              fi
            done
          else
            gh release create "$RELEASE_TAG" \
              "${unitypackages[@]}" \
              --repo "$RELEASE_REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
