name: Release packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release-packages.yml'
      - 'TakenokoShader/Tools~/build_packages.py'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string

permissions:
  contents: write

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  cleanup-development-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Remove ShaderBindingExporter tarballs from existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$RELEASE_REPOSITORY/releases" \
            --jq '.[].assets[] | select(.name | startswith("com.kinankomoti.shaderbindingexporter-")) | select(.name | endswith(".tgz")) | .id' |
          while IFS= read -r asset_id; do
            gh api --method DELETE "repos/$RELEASE_REPOSITORY/releases/assets/$asset_id"
          done
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: cleanup-development-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build packages and preserve previous versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          python TakenokoShader/Tools~/build_packages.py
          --tag "$RELEASE_TAG"
          --repository "$RELEASE_REPOSITORY"
          --previous-index-url "https://github.com/$RELEASE_REPOSITORY/releases/latest/download/index.json"
      - name: Create release with the two public VPM packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          TakenokoShader/Build/Packages/com.kinankomoti.takenokoshader-*.zip
          TakenokoShader/Build/Packages/com.kinankomoti.takenokoshaderarealight-*.zip
          TakenokoShader/Build/Packages/index.json
          --verify-tag --generate-notes --title "$RELEASE_TAG"
